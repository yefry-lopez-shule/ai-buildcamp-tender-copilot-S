[project]
name = "pharma-tender-matcher"
version = "0.1.0"
description = "Matches pharmaceutical portfolio products to public health tender lines and drafts bid recommendations for human review"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "minsearch>=0.2.0",
    "openai>=3.16.2",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "dirdotenv>=0.0.3",
    "jupyter>=1.1.1",
]
